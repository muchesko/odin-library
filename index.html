<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main-container">

        <div class="header">
            <h1>Library</h1>
            <button id="new-book">Add New Book</button>
        </div>

        <div class="library-container" id="library">
        </div>

        <dialog id="new-book-dialog">
            <form>
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title">
                </div>
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author">
                </div>
                <div class="field">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" name="genre">
                </div>
                <div class="field">
                    <label for="pages">Pages</label>
                    <input type="number" id="pages" name="pages">
                </div>
                <div class="field">
                    <label for="read">Read?</label>
                    <div>
                        <input type="radio" id="read-true" name="read" value="true">
                        <label for="read-true">Yes</label>
                    </div>
                    <div>
                        <input type="radio" id="read-false" name="read" value="false">
                        <label for="read-false">No</label>
                    </div>
                </div>
                <div class="field">
                    <input type="submit" id="submit-button" value="Submit">
                </div>
            </form>
        </dialog>

    </div>

    <script src="script.js"></script>
</body>

</html>
